name: Follow the live MCP server

# The EmpirioLabs MCP server follows the EmpirioLabs docs by itself and renders
# this repository's listing at https://mcp.empiriolabs.ai/listing.json. This job
# mirrors it, then refreshes the stores that keep their own copy of the tools.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  # A manual run refreshes both stores even without a change.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: follow-live-server
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
      LOBEHUB_CREDENTIALS_KEY: ${{ secrets.LOBEHUB_CREDENTIALS_KEY }}
      LOBEHUB_CREDENTIALS_SEED: ${{ secrets.LOBEHUB_CREDENTIALS_SEED }}
      MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the listing from the live server
        id: mirror
        run: python3 scripts/follow_live_server.py

      - name: Commit and push the change
        if: steps.mirror.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Follow the live MCP server (${{ steps.mirror.outputs.tools }} tools)"
          git push

      # The registry refuses a version it already holds, so this publishes only a
      # new version in server.json. A manual run also signs in, which proves the
      # domain key still matches https://empiriolabs.ai/.well-known/mcp-registry-auth.
      - name: Check the official MCP registry
        id: registry
        run: python3 scripts/registry_version.py

      - name: Publish to the official MCP registry
        if: (steps.registry.outputs.publish == 'true' || github.event_name == 'workflow_dispatch') && env.MCP_REGISTRY_PRIVATE_KEY != ''
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login http --domain empiriolabs.ai --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          if [ "${{ steps.registry.outputs.publish }}" = "true" ]; then
            ./mcp-publisher publish
          fi
          rm -f mcp-publisher

      - name: Refresh Smithery
        if: (steps.mirror.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.SMITHERY_API_KEY != ''
        run: npx --yes @smithery/cli@latest mcp publish https://mcp.empiriolabs.ai/mcp -n empiriolabs-ai/mcp --config-schema '{"type":"object","properties":{},"additionalProperties":false}'

      - name: Restore the LobeHub session
        if: env.LOBEHUB_CREDENTIALS_KEY != ''
        uses: actions/cache/restore@v4
        with:
          path: .lobehub-session.enc
          key: lobehub-session-${{ github.run_id }}
          restore-keys: lobehub-session-

      - name: Refresh LobeHub
        if: env.LOBEHUB_CREDENTIALS_KEY != ''
        run: |
          python3 scripts/lobehub_session.py unpack
          if [ "${{ steps.mirror.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx --yes @lobehub/market-cli plugin update --dir .
          elif python3 scripts/lobehub_session.py due; then
            npx --yes @lobehub/market-cli plugin list > /dev/null
          fi
          python3 scripts/lobehub_session.py pack

      - name: Save the LobeHub session
        if: always() && env.LOBEHUB_CREDENTIALS_KEY != '' && hashFiles('.lobehub-session.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .lobehub-session.enc
          key: lobehub-session-${{ github.run_id }}
