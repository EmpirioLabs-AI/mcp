version: 2
updates:
  # Version updates wait until a release is a week old: a poisoned release is
  # usually found and pulled within hours. Security updates are not delayed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The locked LobeHub CLI that follow-live-server.yml refreshes the listing with.
  # It lives outside .github/ because Dependabot cannot open pull requests for an
  # npm package file there.
  - package-ecosystem: npm
    directory: /scripts/lobehub-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
