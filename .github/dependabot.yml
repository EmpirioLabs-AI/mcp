version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The locked LobeHub CLI that follow-live-server.yml refreshes the listing with.
  # It lives outside .github/ because Dependabot cannot open pull requests for an
  # npm package file there.
  - package-ecosystem: npm
    directory: /scripts/lobehub-cli
    schedule:
      interval: weekly
